<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Examination System</title>
    <link rel="stylesheet" href="/cssStyle/signin.css">
</head>
<body>
    <div class="container">
        <h1>Sign In</h1>
        <form id="signinForm" action="question.html">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
                <div class="error" id="emailError">Please check your email address</div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <div class="error" id="passwordError">Please check your password</div>
            </div>
            
            <button type="submit">Sign In</button>
        </form>
        
        <div class="register-link">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>

    <script src="/JSFiles/signin.js"></script>
</body>
</html>
